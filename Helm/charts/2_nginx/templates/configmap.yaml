apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx.fullname" . }}-page
  labels:
    {{- include "nginx.labels" . | nindent 4 }}
data:
  index.html: |
    {{- with .Values.page }}
    <html>
      <head><title>{{ .title }}</title></head>
      <body style="background: {{ .colour | default "white" }}; color: white; font-family: sans-serif;">
        <h1>{{ .title }}</h1>
        <p>{{ .message }}</p>
        {{- /* Inside "with", . is .Values.page. Use $ to reach the root. */}}
        <p>Release <b>{{ $.Release.Name }}</b>, revision {{ $.Release.Revision }}, environment <b>{{ $.Values.environment | upper }}</b></p>
    {{- end }}
      </body>
    </html>
