apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# staging: newer nginx image, two replicas, and the database no longer
# exposed outside the cluster.
namespace: staging

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: staging

images:
  - name: nginx
    newTag: "1.27.2"

replicas:
  - name: nginx-deployment
    count: 2

patches:
  # Rename nginx only. A patch touches the one resource in its target,
  # so db and rabbitmq keep their base names. Compare with namePrefix in dev.
  - target:
      kind: Deployment
      name: nginx-deployment
    patch: |-
      - op: replace
        path: /metadata/name
        value: staging-nginx-deployment

  - target:
      kind: Service
      name: nginx-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: staging-nginx-service

  # Remove "type" so db-service falls back to ClusterIP.
  - target:
      kind: Service
      name: db-service
    patch: |-
      - op: remove
        path: /spec/type
