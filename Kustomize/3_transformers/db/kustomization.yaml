apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Suffix only the db objects: db-deployment -> db-deployment-v1
nameSuffix: -v1

# Selector label: added to metadata, pod template and selectors.
labels:
  - pairs:
      tier: database
    includeSelectors: true

resources:
  - db-config.yaml
  - db-depl.yaml
  - db-service.yaml
