apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Requests and limits on every Deployment. Patches only, no new resources.
# No name in the target, so this also catches Deployments added by other
# components, as long as they're listed before this one.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
