apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: the base plus the Mongo admin UI. No limits, no hardening.
namespace: dev

resources:
  - ../../base
  - namespace.yaml

components:
  - ../../components/mongo-express

labels:
  - pairs:
      environment: dev

# Rename nginx only. namePrefix would be shorter, but it renames
# db-service too, and mongo-express finds the database through a plain
# env value (ME_CONFIG_MONGODB_SERVER) that Kustomize doesn't update.
patches:
  - target:
      kind: Deployment
      name: nginx-deployment
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-nginx-deployment

  - target:
      kind: Service
      name: nginx-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-nginx-service
