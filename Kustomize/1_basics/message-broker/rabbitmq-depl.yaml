apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-rabbitmq-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: kustomize-rabbitmq
  template:
    metadata:
      labels:
        component: kustomize-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: kustomize-rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                configMapKeyRef:
                  name: kustomize-rabbitmq-credentials
                  key: password
